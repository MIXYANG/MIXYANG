<title id="t">MIXYANG</title>
<desc id="d">A terminal running an agent. Asked who mixyang is, it reads profile.toml, runs the harness tests, and answers: grad student at the School of AI, Guangzhou University, working on agent infra, harnesses, and agent backends. Email: ruixingxingxing@gmail.com.</desc>
